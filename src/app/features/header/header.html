<header class="flex items-center justify-between px-6 py-3 bg-background border-b border-border">
  <a routerLink="/" class="text-lg font-semibold tracking-tight text-foreground">Divum</a>
  <nav class="flex items-center gap-1">
    @if (isAuthenticated()) {
      <a hlmBtn variant="ghost" routerLink="/minecraft-servers">Minecraft Servers</a>
      <button hlmBtn variant="ghost" (click)="logout()">Logout</button>
    } @else {
      <a hlmBtn variant="ghost" routerLink="/login">Login</a>
      <a hlmBtn variant="ghost" routerLink="/register">Register</a>
    }
  </nav>
</header>
